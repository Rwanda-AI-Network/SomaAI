name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          version: "latest"
      
      - name: Set up Python
        run: uv python install 3.11
      
      - name: Install dependencies
        run: uv sync --extra dev --extra rag --extra vectordb --extra cache
      
      - name: Code Quality (Lint & Format)
        run: |
          uv run ruff check src/
          uv run ruff format --check src/
      
      - name: Type Checking
        run: uv run mypy src/
      
      - name: Run Tests
        run: uv run pytest -v --durations=10
