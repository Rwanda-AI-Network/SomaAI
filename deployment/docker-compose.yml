services:
  # --- Application Stack ---
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: rwandaainetwork/somaai:0.1.1
    restart: unless-stopped
    ports:
      - "${SOMAAI_PORT:-8000}:8000"
    command: uvicorn somaai.main:app --host 0.0.0.0 --port 8000 --workers 1
    env_file:
      - .env
    environment:
      - SOMAAI_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-somaai}:${POSTGRES_PASSWORD:-somaai}@db:5432/${POSTGRES_DB:-somaai}
      - SOMAAI_REDIS_URL=redis://redis:6379/0
      - SOMAAI_REDIS_JOBS_URL=redis://redis:6379/1
      - SOMAAI_REDIS_CACHE_URL=redis://redis:6379/2
      - SOMAAI_QDRANT_URL=http://qdrant:6333
      - SOMAAI_MINIO_ENDPOINT=minio:9000
      - SOMAAI_MINIO_ACCESS_KEY=${SOMAAI_MINIO_ACCESS_KEY}
      - SOMAAI_MINIO_SECRET_KEY=${SOMAAI_MINIO_SECRET_KEY}
    depends_on:
      init-db:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - somaai-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: rwandaainetwork/somaai:0.1.1
    restart: unless-stopped
    command: python -m somaai.jobs.worker
    env_file:
      - .env
    environment:
      - SOMAAI_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-somaai}:${POSTGRES_PASSWORD:-somaai}@db:5432/${POSTGRES_DB:-somaai}
      - SOMAAI_REDIS_URL=redis://redis:6379/0
      - SOMAAI_REDIS_JOBS_URL=redis://redis:6379/1
      - SOMAAI_REDIS_CACHE_URL=redis://redis:6379/2
      - SOMAAI_QDRANT_URL=http://qdrant:6333
      - SOMAAI_MINIO_ENDPOINT=minio:9000
      - SOMAAI_MINIO_ACCESS_KEY=${SOMAAI_MINIO_ACCESS_KEY}
      - SOMAAI_MINIO_SECRET_KEY=${SOMAAI_MINIO_SECRET_KEY}
    depends_on:
      init-db:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - somaai-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  init-db:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: rwandaainetwork/somaai:0.1.1
    command: bash /app/scripts/db_init.sh
    env_file:
      - .env
    environment:
      - SOMAAI_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-somaai}:${POSTGRES_PASSWORD:-somaai}@db:5432/${POSTGRES_DB:-somaai}
      - SOMAAI_MINIO_ACCESS_KEY=${SOMAAI_MINIO_ACCESS_KEY}
      - SOMAAI_MINIO_SECRET_KEY=${SOMAAI_MINIO_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - somaai-network

  # --- Infrastructure ---
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-somaai}
      POSTGRES_USER: ${POSTGRES_USER:-somaai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-somaai}
    # No ports exposed to host in production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-somaai} -d ${POSTGRES_DB:-somaai}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - somaai-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No ports exposed to host in production
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory-policy allkeys-lru --save 60 1
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - somaai-network

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    # No ports exposed to host in production
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [ "CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - somaai-network

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    # Port 9001 exposed for dashboard access, 9000 remains internal
    ports:
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "(curl -f http://localhost:9000/minio/health/live) || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - somaai-network

networks:
  somaai-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
