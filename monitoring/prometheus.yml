global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'somaai-monitor'
    environment: 'production'

# Alert rules
rule_files:
  - '/etc/prometheus/alerts.yml'

scrape_configs:
  # SomaAI FastAPI application
  - job_name: 'somaai-app'
    static_configs:
      - targets: ['app:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# Storage retention
# storage:
#   tsdb:
#     retention.time: 15d
#     retention.size: 5GB
