x-app-common: &app-common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  env_file:
    - ../.env
  environment:
    - DATABASE_URL=postgresql+asyncpg://somaai:somaai@postgres:5432/somaai
    - REDIS_URL=redis://redis:6379/0
    - REDIS_JOBS_URL=redis://redis:6379/1
    - REDIS_CACHE_URL=redis://redis:6379/2
    - QDRANT_URL=http://qdrant:6333
  volumes:
    - ../uploads:/app/uploads
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    qdrant:
      condition: service_healthy
  restart: unless-stopped
  networks:
    - somaai-network

services:
  # SomaAI Application
  app:
    <<: *app-common
    container_name: somaai-app
    ports:
      - "8000:8000"

  # Background Worker
  worker:
    <<: *app-common
    container_name: somaai-worker
    command: python -m somaai.jobs.worker
    stop_grace_period: 1m

  # PostgreSQL - Primary Database
  postgres:
    image: postgres:16-alpine
    container_name: somaai-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=somaai
      - POSTGRES_PASSWORD=somaai
      - POSTGRES_DB=somaai
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U somaai -d somaai" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - somaai-network

  # Redis - Caching & Session Storage & Job Queue
  redis:
    image: redis:7-alpine
    container_name: somaai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - somaai-network

  # Qdrant - Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: somaai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: [ "CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - somaai-network

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: somaai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - somaai-network

  # Grafana - Metrics Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: somaai-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - somaai-network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  prometheus_data:
  grafana_data:


networks:
  somaai-network:
    driver: bridge
